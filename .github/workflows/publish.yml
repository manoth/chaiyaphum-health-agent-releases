name: Publish Agent Binaries

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: publish-agent-binaries
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure read-only source access
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.AGENT_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SOURCE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Select latest source release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet git@github.com:manoth/chaiyaphum-health-agent.git source
          tag="$(git -C source tag --list 'v*' --sort=-v:refname | head -n 1)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            git -C source checkout --quiet "$tag"
          fi

      - uses: actions/setup-go@v5
        if: steps.release.outputs.exists != 'true'
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Test and build Windows and Linux
        if: steps.release.outputs.exists != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cd source
          go test ./...
          version="${RELEASE_VERSION#v}"
          mkdir -p release windows-package linux-package/DEBIAN linux-package/usr/local/bin linux-package/etc/systemd/system linux-package/usr/share/doc/health-agent
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-X main.version=$version" -o release/health-agent-windows-amd64.exe ./cmd/gateway-agent
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-X main.version=$version" -o windows-package/agent-updater.exe ./cmd/agent-updater
          cp release/health-agent-windows-amd64.exe windows-package/health-agent.exe
          cp config.example.json deploy/windows/install.ps1 deploy/windows/uninstall.ps1 windows-package/
          cp internal/platformintegration/assets/cpho-health-agent.ico windows-package/
          (cd windows-package && zip -9 -r ../release/health-agent-windows-amd64.zip .)
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-X main.version=$version" -o release/health-agent-linux-amd64 ./cmd/gateway-agent
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-X main.version=$version" -o linux-package/usr/local/bin/health-agent-updater ./cmd/agent-updater
          cp release/health-agent-linux-amd64 linux-package/usr/local/bin/health-agent
          cp deploy/linux/*.service deploy/linux/*.timer linux-package/etc/systemd/system/
          cp config.example.json linux-package/usr/share/doc/health-agent/config.example.json
          cp deploy/linux/postinst linux-package/DEBIAN/postinst
          chmod 755 linux-package/DEBIAN/postinst
          printf 'Package: health-agent\nVersion: %s\nSection: admin\nPriority: optional\nArchitecture: amd64\nMaintainer: Chaiyaphum Provincial Health Office\nDescription: Secure outbound health data gateway\n' "$version" > linux-package/DEBIAN/control
          dpkg-deb --build --root-owner-group linux-package release/health-agent-linux-amd64.deb
          tar -C linux-package -czf release/health-agent-linux-amd64.tar.gz usr/local/bin etc/systemd/system usr/share/doc/health-agent

      - name: Sign release manifest
        if: steps.release.outputs.exists != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.tag }}
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node source/scripts/build-release-manifest.mjs source/release
          cd source/release
          sha256sum * > SHA256SUMS.txt

      - name: Publish public binary release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" source/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Health Agent $RELEASE_VERSION" \
            --notes "Signed Windows and Linux Health Agent binaries. Source code is maintained in a separate private repository."
